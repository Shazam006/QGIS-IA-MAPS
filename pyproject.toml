[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qgis_ia_maps_server"]

[project]
name = "qgis-ia-maps"
version = "0.1.0"
description = "QGIS map automation bridge for AI and MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.20.0,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
qgis-ia-maps-server = "qgis_ia_maps_server.server:main"
