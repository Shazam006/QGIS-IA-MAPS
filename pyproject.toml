[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[project]
name = "qgis-ia-maps"
version = "0.3.0.dev0"
description = "Agentic QGIS assistant for geoprocessing, spatial analysis, cartography and controlled GPT/MCP execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.20.0,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
qgis-ia-maps-server = "server.server:main"
